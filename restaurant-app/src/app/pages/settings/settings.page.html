<ion-header class="ion-no-border">
  <ion-toolbar class="lux-toolbar">
    <ion-title>Paramètres</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="lux-settings">

  <div class="section">
    <h2 class="section-title">Apparence</h2>
    <ion-item class="theme-item">
      <ion-toggle [checked]="isLightTheme" (ionChange)="onThemeToggle($event)">
        {{ isLightTheme ? 'Thème clair' : 'Thème sombre' }}
      </ion-toggle>
    </ion-item>
  </div>

  <div class="section" *ngIf="!isLoggedIn">
    <h2 class="section-title">Compte</h2>
    <p class="guest-msg">Vous naviguez sans compte.</p>
    <ion-button expand="block" class="cta-gold" (click)="goToLogin()">
      Se connecter ou créer un compte
    </ion-button>
  </div>

  <ng-container *ngIf="isLoggedIn">

    <div class="section">
      <h2 class="section-title">Profil</h2>

      <div class="row">
        <div class="row-info">
          <span class="row-label">Nom</span>
          <span class="row-value">{{ userName }}</span>
        </div>
        <button class="row-action" (click)="editName()">Modifier</button>
      </div>

      <div class="row">
        <div class="row-info">
          <span class="row-label">Email</span>
          <span class="row-value">{{ userEmail }}</span>
        </div>
        <button class="row-action" (click)="editEmail()">Modifier</button>
      </div>

      <div class="row">
        <div class="row-info">
          <span class="row-label">Mot de passe</span>
          <span class="row-value">••••••••</span>
        </div>
        <button class="row-action" (click)="editPassword()">Modifier</button>
      </div>
    </div>

    <p class="success-msg" *ngIf="message">{{ message }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="section">
      <ion-button expand="block" class="logout-btn" (click)="logout()">
        Se déconnecter
      </ion-button>
    </div>

  </ng-container>

</ion-content>
