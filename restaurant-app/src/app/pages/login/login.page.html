<ion-content class="ion-padding lux-login">
  <div class="login-wrap">

    <h1>{{ mode === 'login' ? 'Connexion' : 'Créer un compte' }}</h1>
    <div class="lux-divider"></div>

    <ion-item class="field" *ngIf="mode === 'signup'">
      <ion-input label="Nom" labelPlacement="floating" [(ngModel)]="name"></ion-input>
    </ion-item>

    <ion-item class="field">
      <ion-input label="Email" type="email" labelPlacement="floating" [(ngModel)]="email"></ion-input>
    </ion-item>

    <ion-item class="field">
      <ion-input label="Mot de passe" type="password" labelPlacement="floating" [(ngModel)]="password"></ion-input>
    </ion-item>

    <p class="error" *ngIf="error">{{ error }}</p>

    <ion-button expand="block" class="cta-gold" [disabled]="submitting" (click)="submit()">
      {{ submitting ? 'Patientez…' : (mode === 'login' ? 'Se connecter' : "S'inscrire") }}
    </ion-button>

    <button class="switch-mode" (click)="switchMode()">
      {{ mode === 'login' ? "Pas encore de compte ? S'inscrire" : 'Déjà un compte ? Se connecter' }}
    </button>

    <button class="skip-link" (click)="continueAsGuest()">
      Continuer sans compte
    </button>

  </div>
</ion-content>
